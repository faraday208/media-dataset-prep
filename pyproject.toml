[project]
name = "media-dataset-prep"
version = "0.1.0"
description = "Meta-orchestrator for AI image dataset preparation pipeline"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "faraday208" },
]

# Meta-orchestrator: tüm pipeline tool'larını dependency olarak topluyor.
# uv sync ile her tool'un dependencies'i tek .venv altında kurulur.
# Her tool tools/ altında symlink (development) veya clone (production) olarak yaşar.
dependencies = [
    "media-organizer",
    "media-validator",
    "media-deduplicator",
    "media-quality-checker",
    "media-watermark-detector",
    "media-resizer",
    "media-captioner",
    "media-golden-set",
]

[dependency-groups]
dev = [
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pytest>=8.0",
]
ui = [
    "nicegui>=3.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
asyncio_mode = "auto"
main_file = "ui.py"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "tools/00-organize",
    "tools/01-validate",
    "tools/02-duplicate",
    "tools/03-quality",
    "tools/04-watermark",
    "tools/05-resize",
    "tools/06-caption",
    "tools/07-golden-set",
]

# Workspace member'lara isim üzerinden bağlan
[tool.uv.sources]
media-organizer = { workspace = true }
media-validator = { workspace = true }
media-deduplicator = { workspace = true }
media-quality-checker = { workspace = true }
media-watermark-detector = { workspace = true }
media-resizer = { workspace = true }
media-captioner = { workspace = true }
media-golden-set = { workspace = true }
